{% extends "dashboard/base.html" %}
{% block title %}{{ title }} · BrandMeister Lastheard{% endblock %}
{% block content %}<section class="panel section" style="max-width:560px;margin:0 auto"><h2>{{ labels.user.resetPasswordTitle }}</h2><form method="post" class="stacked-form">{% csrf_token %}<input type="hidden" name="token" value="{{ token }}"><p><label>{{ labels.user.newPassword }}<input type="password" name="password" minlength="8" required></label></p><p><label>{{ labels.user.confirmPassword }}<input type="password" name="confirm_password" minlength="8" required></label></p><div class="form-actions"><button class="button" type="submit">{{ labels.user.resetPasswordButton }}</button></div></form></section>{% endblock %}
