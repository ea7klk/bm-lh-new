{% extends "dashboard/base.html" %}
{% block title %}{{ title }} · BrandMeister Lastheard{% endblock %}
{% block content %}<section class="panel section" style="max-width:560px;margin:0 auto"><h2>{{ labels.user.forgotPasswordTitle }}</h2><p>{{ labels.user.forgotPasswordPrompt }}</p><form method="post" class="stacked-form">{% csrf_token %}<p><label>{{ labels.user.email }}<input type="email" name="email" required></label></p><div class="form-actions"><button class="button" type="submit">{{ labels.user.sendResetLink }}</button></div></form></section>{% endblock %}
