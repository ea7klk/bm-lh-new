name: CI and release image

on:
  push:
  pull_request:
  merge_group:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Tests
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Run tests
        run: python -m pytest -q --junitxml=test-results.xml

      - name: Display test results
        if: always()
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("test-results.xml")
          if report.exists():
              suite = ET.parse(report).getroot()
              tests = int(suite.attrib.get("tests", 0))
              failures = int(suite.attrib.get("failures", 0))
              errors = int(suite.attrib.get("errors", 0))
              skipped = int(suite.attrib.get("skipped", 0))
              passed = max(tests - failures - errors - skipped, 0)
              duration = suite.attrib.get("time", "0")
              body = (
                  "## Test results\n\n"
                  "| Tests | Passed | Failed | Errors | Skipped | Duration |\n"
                  "| ---: | ---: | ---: | ---: | ---: | ---: |\n"
                  f"| {tests} | {passed} | {failures} | {errors} | {skipped} | {duration}s |\n"
              )
          else:
              body = "## Test results\n\nJUnit test results were not generated.\n"

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(body)
          PY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: test-results.xml
          if-no-files-found: warn

  publish-image:
    name: Publish Docker image
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
