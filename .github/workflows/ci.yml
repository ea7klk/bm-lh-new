name: CI and release image

on:
  push:
  pull_request:
  merge_group:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Tests
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bminfo/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r bminfo/requirements.txt

      - name: Check Django application
        env:
          DJANGO_SECRET_KEY: ci-only-secret
          DJANGO_POSTGRES_DB: ci
          DJANGO_POSTGRES_USER: ci
          DJANGO_POSTGRES_PASSWORD: ci
          DJANGO_POSTGRES_HOST: localhost
        run: |
          python bminfo/manage.py check
          python bminfo/manage.py makemigrations --check --dry-run

      - name: Run Django unit tests
        env:
          DJANGO_SECRET_KEY: ci-only-secret
          DJANGO_POSTGRES_DB: ci
          DJANGO_POSTGRES_USER: ci
          DJANGO_POSTGRES_PASSWORD: ci
          DJANGO_POSTGRES_HOST: localhost
        run: python bminfo/manage.py test dashboard.tests --verbosity 2

  publish-image:
    name: Publish Docker image
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./bminfo/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
