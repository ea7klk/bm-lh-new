                        name: web-env
                  resources:
                    requests:
                        cpu: 25m
                        memory: 64Mi
                  command:
                    - ENC[AES256_GCM,data:97rtrRE0JTRLxdWfThzZ,iv:Pb0AqEr4OhoA7s+pqu71H2iXNuk61/fMW4A7Aj/X61g=,tag:T7eZopxQ6QSavVmRUHKxlw==,type:str]
                  args: []
                  workingDir: /app
                  ports:
                    - name: p8000-tcp
                      containerPort: 8000
                      protocol: TCP
                  volumeMounts:
                    - name: shm
                      mountPath: /dev/shm
                  readinessProbe:
