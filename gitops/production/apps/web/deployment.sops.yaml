apiVersion: apps/v1
kind: Deployment
metadata:
    name: web
    namespace: bminfo
spec:
    replicas: 1
    strategy:
        type: Recreate
    selector:
        matchLabels:
            app.kubernetes.io/name: web
    template:
        metadata:
            labels:
                app.kubernetes.io/name: web
        spec:
            nodeSelector:
                kubernetes.io/hostname: spainip-k3s
            automountServiceAccountToken: false
            terminationGracePeriodSeconds: 120
            containers:
                - name: web
                  image: ghcr.io/ea7klk/bminfo-new@sha256:00b04f8c37d715f793a37fac8ce3be7c379eb6ebca16bb74ec81333462cc5d1b
                  imagePullPolicy: IfNotPresent
                  envFrom:
