services:
  postgres:
    image: postgres:16-alpine
    shm_size: ${POSTGRES_SHM_SIZE:-256MB}
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-512MB}
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-150}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-4GB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-16MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-256MB}
      - -c
      - random_page_cost=${POSTGRES_RANDOM_PAGE_COST:-1.1}
      - -c
      - effective_io_concurrency=${POSTGRES_EFFECTIVE_IO_CONCURRENCY:-200}
      - -c
      - autovacuum_max_workers=${POSTGRES_AUTOVACUUM_MAX_WORKERS:-5}
      - -c
      - autovacuum_naptime=${POSTGRES_AUTOVACUUM_NAPTIME:-15s}
      - -c
      - autovacuum_vacuum_scale_factor=${POSTGRES_AUTOVACUUM_VACUUM_SCALE_FACTOR:-0.02}
      - -c
      - autovacuum_analyze_scale_factor=${POSTGRES_AUTOVACUUM_ANALYZE_SCALE_FACTOR:-0.01}
      - -c
      - max_wal_size=${POSTGRES_MAX_WAL_SIZE:-4GB}
      - -c
      - checkpoint_completion_target=${POSTGRES_CHECKPOINT_COMPLETION_TARGET:-0.9}
      - -c
      - wal_compression=${POSTGRES_WAL_COMPRESSION:-on}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  django-postgres:
    image: postgres:16-alpine
    shm_size: ${DJANGO_POSTGRES_SHM_SIZE:-256MB}
    command:
      - postgres
      - -c
      - max_connections=${DJANGO_POSTGRES_MAX_CONNECTIONS:-100}
    environment:
      POSTGRES_DB: ${DJANGO_POSTGRES_DB}
      POSTGRES_USER: ${DJANGO_POSTGRES_USER}
      POSTGRES_PASSWORD: ${DJANGO_POSTGRES_PASSWORD}
    volumes:
      - django_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  pgadmin:
    image: dpage/pgadmin4:9.16
    environment:
      PGADMIN_DEFAULT_EMAIL: ${SMTP_USERNAME}
      PGADMIN_DEFAULT_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.${TRAEFIK_SERVICE_NAME}-pgadmin.loadbalancer.server.port=80"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME}-pgadmin.rule=Host(`${PGADMIN_HOST}`)"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME}-pgadmin.entrypoints=${TRAEFIK_ENTRYPOINT}"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME}-pgadmin.tls.certresolver=${TRAEFIK_CERTRESOLVER}"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME}-pgadmin.service=${TRAEFIK_SERVICE_NAME}-pgadmin"
    depends_on:
      - postgres
    restart: unless-stopped

  collector:
    image: ghcr.io/ea7klk/bm-lh-new:latest
    command: bminfo-collector
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BM_URL: ${BM_URL}
      BM_SOCKETIO_PATH: ${BM_SOCKETIO_PATH}
      BM_JOIN: ${BM_JOIN}
      TALKGROUPS_URL: ${TALKGROUPS_URL}
      TALKGROUPS_SYNC_HOURS: ${TALKGROUPS_SYNC_HOURS}
      EXCLUDE_LOCAL_TALKGROUP: ${EXCLUDE_LOCAL_TALKGROUP}
      KERCHUNK_THRESHOLD_SECONDS: ${KERCHUNK_THRESHOLD_SECONDS}
      RAW_EVENT_KERCHUNK_THRESHOLD_SECONDS: ${RAW_EVENT_KERCHUNK_THRESHOLD_SECONDS:-${KERCHUNK_THRESHOLD_SECONDS}}
      COLLECTOR_HEARTBEAT_SECONDS: ${COLLECTOR_HEARTBEAT_SECONDS}
      COLLECTOR_SHUTDOWN_TIMEOUT_SECONDS: ${COLLECTOR_SHUTDOWN_TIMEOUT_SECONDS:-15}
      POSTGRES_POOL_MIN_SIZE: ${POSTGRES_POOL_MIN_SIZE:-2}
      POSTGRES_POOL_MAX_SIZE: ${POSTGRES_POOL_MAX_SIZE:-20}
    depends_on:
      - postgres
    init: true
    stop_grace_period: ${COLLECTOR_SHUTDOWN_TIMEOUT_SECONDS:-15}s
    restart: unless-stopped

  web:
    image: ghcr.io/ea7klk/bm-lh-new:latest
    command: uvicorn bminfo.web:app --host ${APP_HOST} --port ${APP_PORT} --workers ${WEB_WORKERS:-2}
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KERCHUNK_THRESHOLD_SECONDS: ${KERCHUNK_THRESHOLD_SECONDS}
      RAW_EVENT_KERCHUNK_THRESHOLD_SECONDS: ${RAW_EVENT_KERCHUNK_THRESHOLD_SECONDS:-${KERCHUNK_THRESHOLD_SECONDS}}
      COLLECTOR_HEARTBEAT_SECONDS: ${COLLECTOR_HEARTBEAT_SECONDS}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE}
      SESSION_HOURS: ${SESSION_HOURS}
      POSTGRES_POOL_MIN_SIZE: ${POSTGRES_POOL_MIN_SIZE:-2}
      POSTGRES_POOL_MAX_SIZE: ${POSTGRES_POOL_MAX_SIZE:-20}
      MATOMO_ENABLED: ${MATOMO_ENABLED}
      MATOMO_URL: ${MATOMO_URL}
      MATOMO_SITE_ID: ${MATOMO_SITE_ID}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL}
      PGADMIN_HOST: ${PGADMIN_HOST}
      SMTP_ENABLED: ${SMTP_ENABLED}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_USE_TLS: ${SMTP_USE_TLS}
      SMTP_USE_SSL: ${SMTP_USE_SSL}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS}
      EMAIL_VERIFICATION_HOURS: ${EMAIL_VERIFICATION_HOURS}
      PASSWORD_RESET_HOURS: ${PASSWORD_RESET_HOURS}
    depends_on:
      - postgres
    restart: unless-stopped

  django:
    image: ghcr.io/${GHCR_IMAGE_OWNER:-ea7klk}/bm-lh-new-django:latest
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_POSTGRES_HOST: django-postgres
      DJANGO_POSTGRES_PORT: ${DJANGO_POSTGRES_PORT:-5432}
      DJANGO_POSTGRES_DB: ${DJANGO_POSTGRES_DB}
      DJANGO_POSTGRES_USER: ${DJANGO_POSTGRES_USER}
      DJANGO_POSTGRES_PASSWORD: ${DJANGO_POSTGRES_PASSWORD}
      DJANGO_DB_CONN_MAX_AGE: ${DJANGO_DB_CONN_MAX_AGE:-0}
      DJANGO_MIGRATION_BATCH_SIZE: ${DJANGO_MIGRATION_BATCH_SIZE:-1000}
      DJANGO_WORKERS: ${DJANGO_WORKERS:-2}
      DJANGO_COLLECTOR_ENABLED: ${DJANGO_COLLECTOR_ENABLED:-true}
      DJANGO_ADMIN_CALLSIGN: ${DJANGO_ADMIN_CALLSIGN:-ADMIN}
      DJANGO_ADMIN_EMAIL: ${SMTP_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL}
      SMTP_ENABLED: ${SMTP_ENABLED}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_USE_TLS: ${SMTP_USE_TLS}
      SMTP_USE_SSL: ${SMTP_USE_SSL}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS}
      EMAIL_VERIFICATION_HOURS: ${EMAIL_VERIFICATION_HOURS}
      PASSWORD_RESET_HOURS: ${PASSWORD_RESET_HOURS}
      APP_TIMEZONE: ${APP_TIMEZONE}
      COOKIE_SECURE: ${COOKIE_SECURE}
      BM_URL: ${BM_URL}
      BM_SOCKETIO_PATH: ${BM_SOCKETIO_PATH}
      BM_JOIN: ${BM_JOIN}
      TALKGROUPS_URL: ${TALKGROUPS_URL}
      TALKGROUPS_SYNC_HOURS: ${TALKGROUPS_SYNC_HOURS}
      EXCLUDE_LOCAL_TALKGROUP: ${EXCLUDE_LOCAL_TALKGROUP}
      KERCHUNK_THRESHOLD_SECONDS: ${KERCHUNK_THRESHOLD_SECONDS}
      RAW_EVENT_KERCHUNK_THRESHOLD_SECONDS: ${RAW_EVENT_KERCHUNK_THRESHOLD_SECONDS:-${KERCHUNK_THRESHOLD_SECONDS}}
      COLLECTOR_HEARTBEAT_SECONDS: ${COLLECTOR_HEARTBEAT_SECONDS}
      LEGACY_POSTGRES_HOST: postgres
      LEGACY_POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      LEGACY_POSTGRES_DB: ${POSTGRES_DB}
      LEGACY_POSTGRES_USER: ${POSTGRES_USER}
      LEGACY_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.${TRAEFIK_SERVICE_NAME}-django.loadbalancer.server.port=8000"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME}-django.rule=Host(`${TRAEFIK_HOST}`)"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME}-django.entrypoints=${TRAEFIK_ENTRYPOINT}"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME}-django.tls.certresolver=${TRAEFIK_CERTRESOLVER}"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME}-django.service=${TRAEFIK_SERVICE_NAME}-django"
    depends_on:
      django-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
  django_postgres_data:
