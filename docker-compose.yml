services:
  postgres:
    image: postgres:16-alpine
    shm_size: ${POSTGRES_SHM_SIZE:-256MB}
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-100}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:9.16
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: bminfo/Dockerfile
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_POSTGRES_HOST: postgres
      DJANGO_POSTGRES_PORT: "5432"
      DJANGO_POSTGRES_DB: ${POSTGRES_DB}
      DJANGO_POSTGRES_USER: ${POSTGRES_USER}
      DJANGO_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DJANGO_DB_CONN_MAX_AGE: ${DJANGO_DB_CONN_MAX_AGE:-0}
      DJANGO_WORKERS: ${DJANGO_WORKERS:-2}
      DJANGO_COLLECTOR_ENABLED: ${DJANGO_COLLECTOR_ENABLED:-true}
      DJANGO_ADMIN_CALLSIGN: ${DJANGO_ADMIN_CALLSIGN:-ADMIN}
      DJANGO_ADMIN_EMAIL: ${DJANGO_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL}
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SMTP_ENABLED: ${SMTP_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-BrandMeister Lastheard}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-20}
      EMAIL_VERIFICATION_HOURS: ${EMAIL_VERIFICATION_HOURS:-48}
      PASSWORD_RESET_HOURS: ${PASSWORD_RESET_HOURS:-1}
      MATOMO_ENABLED: ${MATOMO_ENABLED:-false}
      MATOMO_URL: ${MATOMO_URL:-}
      MATOMO_SITE_ID: ${MATOMO_SITE_ID:-}
      BM_URL: ${BM_URL}
      BM_SOCKETIO_PATH: ${BM_SOCKETIO_PATH:-/lh/socket.io}
      BM_JOIN: ${BM_JOIN:-everything}
      TALKGROUPS_URL: ${TALKGROUPS_URL}
      TALKGROUPS_SYNC_HOURS: ${TALKGROUPS_SYNC_HOURS:-24}
      EXCLUDE_LOCAL_TALKGROUP: ${EXCLUDE_LOCAL_TALKGROUP:-9}
      KERCHUNK_THRESHOLD_SECONDS: ${KERCHUNK_THRESHOLD_SECONDS:-3}
      RAW_EVENT_KERCHUNK_THRESHOLD_SECONDS: ${RAW_EVENT_KERCHUNK_THRESHOLD_SECONDS:-3}
      COLLECTOR_HEARTBEAT_SECONDS: ${COLLECTOR_HEARTBEAT_SECONDS:-30}
    ports:
      - "${WEB_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
