---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "annotations": {
      "deployment.kubernetes.io/revision": "1"
    },
    "labels": {
      "kustomize.toolkit.fluxcd.io/name": "bminfo-pgadmin",
      "kustomize.toolkit.fluxcd.io/namespace": "flux-system"
    },
    "name": "pgadmin",
    "namespace": "bminfo"
  },
  "spec": {
    "progressDeadlineSeconds": 600,
    "replicas": 1,
    "revisionHistoryLimit": 10,
    "selector": {
      "matchLabels": {
        "app.kubernetes.io/name": "pgadmin"
      }
    },
    "strategy": {
      "type": "Recreate"
    },
    "template": {
      "metadata": {
        "labels": {
          "app.kubernetes.io/name": "pgadmin"
        }
      },
      "spec": {
        "automountServiceAccountToken": false,
        "containers": [
          {
            "command": [
              "/entrypoint.sh"
            ],
            "envFrom": [
              {
                "secretRef": {
                  "name": "pgadmin-env"
                }
              }
            ],
            "image": "dpage/pgadmin4@sha256:40fa840c5bb7c8463957f1255b01283732c2d8c9396a956d180f8e6c296753b3",
            "imagePullPolicy": "IfNotPresent",
            "name": "pgadmin",
            "ports": [
              {
                "containerPort": 80,
                "name": "p80-tcp",
                "protocol": "TCP"
              },
              {
                "containerPort": 443,
                "name": "p443-tcp",
                "protocol": "TCP"
              }
            ],
            "readinessProbe": {
              "failureThreshold": 3,
              "periodSeconds": 10,
              "successThreshold": 1,
              "tcpSocket": {
                "port": 80
              },
              "timeoutSeconds": 1
            },
            "resources": {
              "requests": {
                "cpu": "25m",
                "memory": "64Mi"
              }
            },
            "securityContext": {
              "runAsUser": 5050
            },
            "startupProbe": {
              "failureThreshold": 180,
              "periodSeconds": 10,
              "successThreshold": 1,
              "tcpSocket": {
                "port": 80
              },
              "timeoutSeconds": 1
            },
            "terminationMessagePath": "/dev/termination-log",
            "terminationMessagePolicy": "File",
            "volumeMounts": [
              {
                "mountPath": "/var/lib/pgadmin",
                "name": "v-170642bc4e016938"
              },
              {
                "mountPath": "/dev/shm",
                "name": "shm"
              }
            ],
            "workingDir": "/pgadmin4"
          }
        ],
        "dnsPolicy": "ClusterFirst",
        "imagePullSecrets": [
          {
            "name": "registry-credentials"
          }
        ],
        "nodeSelector": {
          "kubernetes.io/hostname": "spainip-k3s"
        },
        "restartPolicy": "Always",
        "schedulerName": "default-scheduler",
        "securityContext": {},
        "terminationGracePeriodSeconds": 120,
        "volumes": [
          {
            "name": "v-170642bc4e016938",
            "persistentVolumeClaim": {
              "claimName": "v-170642bc4e016938"
            }
          },
          {
            "emptyDir": {
              "medium": "Memory",
              "sizeLimit": "67108864"
            },
            "name": "shm"
          }
        ]
      }
    }
  }
}

---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "annotations": {
      "deployment.kubernetes.io/revision": "1"
    },
    "labels": {
      "kustomize.toolkit.fluxcd.io/name": "bminfo-postgres",
      "kustomize.toolkit.fluxcd.io/namespace": "flux-system"
    },
    "name": "postgres",
    "namespace": "bminfo"
  },
  "spec": {
    "progressDeadlineSeconds": 600,
    "replicas": 1,
    "revisionHistoryLimit": 10,
    "selector": {
      "matchLabels": {
        "app.kubernetes.io/name": "postgres"
      }
    },
    "strategy": {
      "type": "Recreate"
    },
    "template": {
      "metadata": {
        "labels": {
          "app.kubernetes.io/name": "postgres"
        }
      },
      "spec": {
        "automountServiceAccountToken": false,
        "containers": [
          {
            "args": [
              "postgres",
              "-c",
              "max_connections=120",
              "-c",
              "shared_buffers=256MB",
              "-c",
              "effective_cache_size=1GB",
              "-c",
              "work_mem=8MB",
              "-c",
              "maintenance_work_mem=128MB",
              "-c",
              "max_wal_size=2GB"
            ],
            "command": [
              "docker-entrypoint.sh"
            ],
            "envFrom": [
              {
                "secretRef": {
                  "name": "postgres-env"
                }
              }
            ],
            "image": "postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777",
            "imagePullPolicy": "IfNotPresent",
            "name": "postgres",
            "ports": [
              {
                "containerPort": 5432,
                "name": "p5432-tcp",
                "protocol": "TCP"
              }
            ],
            "readinessProbe": {
              "exec": {
                "command": [
                  "/bin/sh",
                  "-c",
                  "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
                ]
              },
              "failureThreshold": 3,
              "periodSeconds": 10,
              "successThreshold": 1,
              "timeoutSeconds": 5
            },
            "resources": {
              "requests": {
                "cpu": "25m",
                "memory": "8Gi"
              }
            },
            "startupProbe": {
              "exec": {
                "command": [
                  "/bin/sh",
                  "-c",
                  "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
                ]
              },
              "failureThreshold": 180,
              "periodSeconds": 10,
              "successThreshold": 1,
              "timeoutSeconds": 5
            },
            "terminationMessagePath": "/dev/termination-log",
            "terminationMessagePolicy": "File",
            "volumeMounts": [
              {
                "mountPath": "/var/lib/postgresql/data",
                "name": "v-f5b2c398ce5127fa"
              },
              {
                "mountPath": "/dev/shm",
                "name": "shm"
              }
            ],
            "workingDir": "/"
          }
        ],
        "dnsPolicy": "ClusterFirst",
        "imagePullSecrets": [
          {
            "name": "registry-credentials"
          }
        ],
        "nodeSelector": {
          "kubernetes.io/hostname": "spainip-k3s"
        },
        "restartPolicy": "Always",
        "schedulerName": "default-scheduler",
        "securityContext": {},
        "terminationGracePeriodSeconds": 120,
        "volumes": [
          {
            "name": "v-f5b2c398ce5127fa",
            "persistentVolumeClaim": {
              "claimName": "v-f5b2c398ce5127fa"
            }
          },
          {
            "emptyDir": {
              "medium": "Memory",
              "sizeLimit": "268435456"
            },
            "name": "shm"
          }
        ]
      }
    }
  }
}

