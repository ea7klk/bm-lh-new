---
{
  "apiVersion": "batch/v1",
  "kind": "CronJob",
  "metadata": {
    "labels": {
      "kustomize.toolkit.fluxcd.io/name": "bminfo-web",
      "kustomize.toolkit.fluxcd.io/namespace": "flux-system"
    },
    "name": "purge-unverified-users",
    "namespace": "bminfo"
  },
  "spec": {
    "concurrencyPolicy": "Forbid",
    "failedJobsHistoryLimit": 3,
    "jobTemplate": {
      "spec": {
        "backoffLimit": 2,
        "template": {
          "metadata": {
            "labels": {
              "app.kubernetes.io/name": "purge-unverified-users"
            }
          },
          "spec": {
            "automountServiceAccountToken": false,
            "containers": [
              {
                "command": [
                  "python",
                  "manage.py",
                  "purge_unverified_users"
                ],
                "envFrom": [
                  {
                    "secretRef": {
                      "name": "web-env"
                    }
                  }
                ],
                "image": "ghcr.io/ea7klk/bminfo-new:v1.2.8@sha256:bee6f4564d2d691c14b8f9c2899364a43e7700c3f5815f1d99a9024c503fb594",
                "imagePullPolicy": "IfNotPresent",
                "name": "purge-unverified-users",
                "resources": {
                  "requests": {
                    "cpu": "25m",
                    "memory": "64Mi"
                  }
                },
                "securityContext": {},
                "workingDir": "/app"
              }
            ],
            "dnsPolicy": "ClusterFirst",
            "imagePullSecrets": [
              {
                "name": "registry-credentials"
              }
            ],
            "nodeSelector": {
              "kubernetes.io/hostname": "spainip-k3s"
            },
            "restartPolicy": "OnFailure",
            "schedulerName": "default-scheduler",
            "securityContext": {},
            "terminationGracePeriodSeconds": 30
          }
        }
      }
    },
    "schedule": "17 3 * * *",
    "successfulJobsHistoryLimit": 1,
    "timeZone": "Etc/UTC"
  }
}
