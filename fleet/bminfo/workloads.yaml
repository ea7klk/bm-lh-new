        },
        "restartPolicy": "Always",
        "schedulerName": "default-scheduler",
        "securityContext": {},
        "terminationGracePeriodSeconds": 120,
        "volumes": [
          {
            "emptyDir": {
              "medium": "Memory",
              "sizeLimit": "67108864"
            },
            "name": "shm"
          }
        ]
      }
    }
  }
